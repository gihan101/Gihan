    <!-- Early ResizeObserver benign warning suppression -->
    <script>
      (function() {
        var isROError = function(msg) {
          return typeof msg === 'string' && (
            msg.indexOf('ResizeObserver loop completed with undelivered notifications') !== -1 ||
            msg.indexOf('ResizeObserver loop limit exceeded') !== -1
          );
        };
        window.addEventListener('error', function(e) {
          if (isROError(e.message)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
        if (window.ResizeObserver) {
          var OriginalRO = window.ResizeObserver;
          window.ResizeObserver = function(callback) {
            return new OriginalRO(function(entries, observer) {
              window.requestAnimationFrame(function() {
                try {
                  callback(entries, observer);
                } catch (err) {
                  if (!err || !isROError(err.message)) {
                    console.error(err);
                  }
                }
              });
            });
          };
          window.ResizeObserver.prototype = OriginalRO.prototype;
        }
      })();
    </script>
